<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de velocidade</title>
</head>
<body>
    <h1>Sistema de Velocidade</h1>
    Velocidade atinjida <input type="number" name="tnt1" id="tnt1">:
    <input type="button" value="Verificar" onclick="clicar()">
    <div id="res"></div>
    



<script>
function clicar(){
var tnt = document.getElementById(`tnt1`)
var res = document.getElementById(`res`)
var vel = Number(tnt.value)
if (vel > 60 ) {

    res.innerHTML= 'Voce foi multado'
    res.style.background = 'red'

}

else {
    res.innerHTML= 'Dirija sempre com o cinto de segurança !'
    

}


}








</script>


</body>
</html>
