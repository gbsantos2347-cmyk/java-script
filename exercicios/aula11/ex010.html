<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do carro :<input type="number" name="txtvel" id="txtvel"> km/h
    <input type="button" value="Verificar" onclick="clicar()">
    <div id="res"></div>


<script>

function clicar(){
var txt1 = window.document.querySelector('input#txtvel')
var res = document.querySelector('div#res')
var vel = Number(txt1.value)
res.innerHTML = `Sua velocidade atual e de ${vel} km/h`
if (vel> 60) { 
    res.innerHTML = `Voçe foi <strong>MULTADO!</strong>`
}
else {
    res.innerHTML = `Dirija sempre como o cinto de segurança`
}

}





</script>

</body>
</html>
