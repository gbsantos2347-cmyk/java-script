<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const valorconta = Number(prompt('Digite o valor total da conta: '))
        const numeropessoas = Number(prompt('Digite o número de pessoas: '))
        const valorporpessoa = valorconta / numeropessoas
        alert(`O valor a ser pago por pessoa e: R$${valorporpessoa.toFixed(2)}`)




    </script>
</body>
</html>
