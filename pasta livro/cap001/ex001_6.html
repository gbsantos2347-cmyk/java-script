<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treino</title>
</head>
<body>
    <script>
    const n1 = Number(prompt('seu numero é :'))   //entrada
    const n2 = Number(prompt('Seu outro numero é igual a :'))
    const soma = n1 + n2                          //processamento
    alert('Seu numero e igual a ' + soma)       //saída

    </script>
</body>
</html>
