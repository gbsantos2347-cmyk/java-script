<body>
    <h1>Antes e depois</h1>
    <button onclick="clicar()">Antecessor e Sucessor </button>

<script>
function clicar(){
var num = Number(prompt('Digite um numero inteiro qualquer'));
var suce = num + 1
var ante = num - 1
alert(`Antes de ${num} temos o numero ${ante} depois temos o numero ${suce}`)
}
</script>
